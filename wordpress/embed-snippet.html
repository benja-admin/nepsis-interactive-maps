<!--
  Nepsis Ministries Holy Land map - WordPress embed snippet
  =====================================
  Paste this whole block into a Gutenberg "Custom HTML" block
  (Add block  →  search "Custom HTML"), or into a Classic Editor
  "Text" tab. Do NOT paste it into the Visual tab - WordPress will
  mangle the tags.

  ONE THING TO EDIT: replace the src path below if you uploaded the
  folder somewhere other than /nepsis-map/.
-->

<div class="hl3d-embed">
  <iframe
    src="/nepsis-map/index.html?embed=1"
    title="Nepsis Ministries - interactive 3D map of the Holy Land"
    loading="lazy"
    allowfullscreen
    allow="fullscreen"
    referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>

<p class="hl3d-caption">
  Drag to pan · <strong>Ctrl</strong> (or <strong>⌘</strong>) + scroll to zoom ·
  right-drag to tilt and rotate. Use the timeline at the bottom to filter by
  biblical era, and click any marker for its scripture references.
  <a href="/nepsis-map/" target="_blank" rel="noopener">Open the full-screen map ↗</a>
</p>

<style>

  position: relative;
  width: 100%;
  height: 78vh;          /* tall enough that the 3D actually reads */

  max-height: 900px;

  border-radius: 12px;
  overflow: hidden;
  background: #0b1017;   /* matches the map while it loads */

}

  position: absolute;
  inset: 0;

  height: 100%;

  display: block;
}

  font-size: .85rem;
  opacity: .75;
  line-height: 1.5;
  margin-top: 0;
